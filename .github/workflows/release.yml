name: Windows Build and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows packages
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test release version rules
        shell: pwsh
        run: ./.github/scripts/test-release-version.ps1
      - name: Derive release version
        id: version
        shell: pwsh
        run: ./.github/scripts/release-version.ps1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Locate Inno Setup (install only if absent)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
      - name: Build application and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/build_exe.ps1 -Version $env:APP_VERSION -RequireInstaller
      - name: Verify frozen application imports and package ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($file in @('dist/Johnny/Johnny.exe', 'dist/JohnnySetup.exe')) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "Missing or empty build output: $file"
            }
          }
          $process = Start-Process dist/Johnny/Johnny.exe -ArgumentList '--build-smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Frozen application smoke test timed out'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path build-smoke-test.log) { Get-Content build-smoke-test.log }
            throw 'Frozen application imports failed'
          }
          Compress-Archive -Path 'dist/Johnny/*' -DestinationPath "dist/Johnny-$env:APP_VERSION-portable-win64.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: johnny-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/JohnnySetup.exe
            dist/Johnny-*-portable-win64.zip
  verify-artifacts:
    name: Verify uploaded release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: johnny-windows-${{ needs.build.outputs.version }}
          path: dist
      - name: Check downloaded installer and portable ZIP contents
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          assert Path('dist/JohnnySetup.exe').stat().st_size > 0, 'Empty installer'
          with ZipFile(f'dist/Johnny-{os.environ["APP_VERSION"]}-portable-win64.zip') as archive:
              assert 'Johnny.exe' in archive.namelist(), 'Portable executable missing'
              assert archive.testzip() is None, 'Corrupt portable ZIP'
          PY
  release:
    name: Publish verified packages
    needs: [build, verify-artifacts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: johnny-windows-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release through a recoverable draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > is-draft.txt; then
            if [ "$(cat is-draft.txt)" = false ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Johnny $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/JohnnySetup.exe dist/Johnny-*-portable-win64.zip --clobber
          gh release edit "$TAG" --draft=false --latest
